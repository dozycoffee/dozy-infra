# Kafka 토픽 선언(단일 원본). charts/kafka-self가 `-f topics/topics.yaml`로 읽어 토픽을 만든다.
# 설계: docs/infra-repo-design.md 7절
#
# 규칙
# - 토픽은 여기서만 만든다. 서비스는 만들지 않고 브로커 자동 생성도 끈다.
# - partitions는 숫자여야 한다. 처음 정하면 늘리지 않는다(같은 키의 순서 보장이 파티션 수에 묶여 있다).
# - 이벤트 계약에 수치가 없는 토픽은 키 순서가 필요한 토픽 3, DLT 1로 시작한다(설계 문서 10절 #3). 부하 테스트 뒤 조정한다.
# - partitions가 숫자가 아니면(예: TBD) 차트가 렌더링에 실패한다(의도된 동작).
# - 확인하지 못한 값은 지어내지 않는다.
# - owner는 이 토픽의 정의를 책임지는 서비스다. DLT는 실패 메시지를 보내는(소비하는) 서비스가 owner다.
topics:
  # catalog (발행). 토픽 생성 코드 없음
  - name: dozy.catalog.product
    owner: catalog
    partitions: 3
    # retentionMs: Store가 구독을 시작하기까지의 지연보다 길게. 정해지면 추가한다

  # inventory (발행). 토픽 생성 코드 없음. {topic-prefix}.{집계 유형 소문자}로 발행한다(ADR-0025)
  - name: dozy.inventory.inventory
    owner: inventory
    partitions: 3
  - name: dozy.inventory.reservation # wms가 구독
    owner: inventory
    partitions: 3
  - name: dozy.inventory.lot # wms가 구독
    owner: inventory
    partitions: 3
  - name: dozy.inventory.adjustment
    owner: inventory
    partitions: 3
  - name: dozy.inventory.product # wms가 구독
    owner: inventory
    partitions: 3
    cleanupPolicy: compact # 필요: wms는 새 환경에서 처음부터 읽어 상품 사본을 채운다(wms ADR-0021, ADR-0026)

  # wms (발행). wms의 이전 NewTopic 설정값을 그대로 이어받는다(partitions 3, replicas 1, compact)
  - name: dozy.wms.warehouse-access # inventory가 구독
    owner: wms
    partitions: 3
    replicationFactor: 1
    cleanupPolicy: compact

  # 실패한 메시지를 보내는 DLT. 소비 서비스의 오류 처리기가 `{원 토픽}.dlt`(소문자)로 보낸다. 파티션은 지정하지 않고 보낸다
  - name: dozy.wms.warehouse-access.dlt # inventory가 소비
    owner: inventory
    partitions: 1
  - name: dozy.inventory.product.dlt # wms가 소비
    owner: wms
    partitions: 1
  - name: dozy.inventory.reservation.dlt # wms가 소비
    owner: wms
    partitions: 1
  - name: dozy.inventory.lot.dlt # wms가 소비
    owner: wms
    partitions: 1
