{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "dozy-service.name" . }}
  labels:
    {{- include "dozy-service.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "dozy-service.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  {{- if or .Values.networkPolicy.allowedNamespaces .Values.networkPolicy.allowedPods }}
  ingress:
    - from:
        {{- range .Values.networkPolicy.allowedNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
        {{- end }}
        {{- range .Values.networkPolicy.allowedPods }}
        - podSelector:
            matchLabels:
              {{- toYaml . | nindent 14 }}
        {{- end }}
      ports:
        - port: {{ .Values.port }}
          protocol: TCP
  {{- else }}
  ingress: []
  {{- end }}
{{- end }}
