{{- if and .Values.externalSecret.enabled .Values.externalSecret.items }}
apiVersion: {{ .Values.externalSecret.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ include "dozy-service.name" . }}
  labels:
    {{- include "dozy-service.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecret.storeName }}
    kind: {{ .Values.externalSecret.storeKind }}
  target:
    name: {{ include "dozy-service.name" . }}
    creationPolicy: Owner
  data:
    {{- range $item := .Values.externalSecret.items }}
    - secretKey: {{ $item }}
      remoteRef:
        key: {{ $.Values.externalSecret.secretPrefix }}-{{ include "dozy-service.name" $ }}-{{ $item }}
    {{- end }}
{{- end }}
