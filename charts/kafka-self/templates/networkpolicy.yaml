{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kafka-self.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "kafka-self.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        {{- range .Values.networkPolicy.allowedNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
        {{- end }}
        # 같은 네임스페이스의 토픽 생성 Job
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: topic-init
      ports:
        - protocol: TCP
          port: {{ .Values.port }}
{{- end }}
