# 단일 브로커 Kafka. 로컬 compose(KRaft 단일 노드)의 설정을 쿠버네티스로 옮긴 것이다.

# StatefulSet 이름. 파드 이름(kafka-0)과 광고 주소(DNS)가 이 이름에서 정해지므로 바꾸면 서비스의 bootstrap 주소도 바뀐다.
name: kafka

image:
  repository: apache/kafka
  tag: "3.9.1"
  pullPolicy: IfNotPresent

# 헤드리스 서비스. 파드 DNS(kafka-0.<service>.<namespace>.svc.cluster.local)를 만든다.
headlessServiceName: kafka-headless
port: 9092

# 힙은 컨테이너 메모리 limit보다 작아야 한다.
heapOpts: "-Xms1g -Xmx1g"

# Autopilot은 requests를 기준으로 과금하고 limits와 같게 맞춘다.
resources:
  requests:
    cpu: 500m
    memory: 2Gi
  limits:
    cpu: 500m
    memory: 2Gi

storage:
  size: 10Gi
  # 비우면 클러스터 기본 StorageClass를 쓴다(Autopilot은 standard-rwo).
  storageClassName: ""

# 클러스터 안에서만 접근한다. 아래 네임스페이스의 파드와 이 차트의 토픽 생성 Job만 9092에 접속할 수 있다.
networkPolicy:
  enabled: true
  allowedNamespaces:
    - app

topicsJob:
  # 브로커가 뜰 때까지 기다리는 최대 횟수(5초 간격)
  waitAttempts: 60
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 250m
      memory: 512Mi

# 토픽 선언. 이 값은 저장소 최상위 topics/topics.yaml에서 -f로 넘긴다(단일 원본).
#   name:            토픽 이름
#   partitions:      숫자(필수). 처음 정하면 늘리지 않는다
#   replicationFactor: 기본 1 (단일 브로커)
#   cleanupPolicy:   delete 또는 compact (생략하면 브로커 기본값)
#   retentionMs:     보존 기간(밀리초, 생략하면 브로커 기본값)
topics: []
