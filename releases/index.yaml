# 배포할 서비스와 순서. deploy.sh가 wave 오름차순으로 한 wave씩 helm upgrade --install 한다.
# 서비스는 하나씩 Ready가 될 때까지 기다리며 올린다(같은 wave 안에서는 이름순).
# 서비스 기동 순서: auth가 먼저(다른 서비스가 JWKS를 조회한다), 나머지는 그 뒤. 설계 문서 6.1절.
namespace: app
chart: charts/dozy-service
services:
  - { name: auth, wave: 1 }
  - { name: inventory, wave: 2 }
  - { name: wms, wave: 2 }
  - { name: catalog, wave: 2 }
